KSP_COMMUNITY_FIXES
{
  // 本文件是"Settings.cfg 不存在时"的创建模板，只含 adapter 声明过的键。
  // 真机上的真实文件有 137 条键，这里不复制全量——未知键由 unlisted:preserve 负责不动。

  // ##########################
  // Major bugfixes
  // ##########################

  // 回收部件时按 IPartCostModifier 退还资金
  RefundingOnRecovery = true

  // 修复 1.12.2 宇航员背包持久化失效
  KerbalInventoryPersistence = true

  // 阻止 Breaking Grounds 机械关节位置漂移
  RoboticsDrift = true

  // 修复 1.12.3 对接口旋转引起的部件漂移
  DockingPortRotationDriftAndFixes = true

  // 自动加固按原始位置建关节（改善物理稳定性）
  AutoStrutDrift = true

  // 装/卸/升级 mod 后不再丢模块持久化状态
  ModuleIndexingMismatch = true

  // 打包非着陆部件时重置旋转
  PackedPartsRotation = true

  // 部件初始化顺序加固（防场景加载时的海妖）
  PartStartStability = true

  // ##########################
  // Minor bugfixes
  // ##########################

  // 记住部件操作窗分组的展开状态
  PAWGroupMemory = true

  // 修复部件操作窗条目随机跳位/闪烁
  PAWItemsOrder = true

  // 修复反作用轮可用扭矩报错（轮力低于 100% 时）
  ReactionWheelsPotentialTorque = true

  // 旗帜部件按实际模型尺寸取阻力立方
  CorrectDragForFlags = true

  // 开启重生时把死亡宇航员改判为失踪并开始计时
  RespawnDeadKerbals = true

  // 让策略遵守 Duration 设置（会改变原版玩法，默认关）
  StrategyDuration = false

  // ##########################
  // Performance
  // ##########################

  // 场景加载提速
  SceneLoadSpeedBoost = true

  // 清理托管内存泄漏并在切场景时记录
  MemoryLeaks = true

  // 退出纯 UI 建筑/删飞船时不再自动存档
  FewerSaves = false

  // 存档与 craft 文件不写缩进（更快，但人读变差）
  SkipIndentsOnSavesAndCraftFiles = false

  // ##########################
  // Quality of life
  // ##########################

  // 新战役开局不弹介绍弹窗
  DisableNewGameIntro = false

  // 不渲染不可见宇航员头像（多人时省性能）
  DisableHiddenPortraits = true

  // 调试控制台不再抢输入焦点（Alt+F12）
  DebugConsoleDontStealInput = true

  // ##########################
  // Nested settings nodes
  // ##########################
  // 子节点必须放在根节点大括号内；adapter 用 fields[].nodePath 定位这些键。

  MANEUVER_TOOL_DEFAULTS
  {
    // 机动节点工具默认启用（关掉后仍可从 ESC 设置里手动开启）
    ManeuverToolEnabledByDefault = true

    // 强制禁用机动节点工具（用户无法再开启）
    ManeuverToolAlwaysDisabled = false
  }

  MEMORY_LEAKS_DEBUGGING
  {
    // 切场景时强制 GC 以取得更准的托管内存读数（会卡顿）
    ForceGCCollect = false

    // 记录被销毁 UnityEngine.Object 的 GameEvents 泄漏
    LogDestroyedUnityObjectGameEventsLeaks = true

    // 跨场景比对存活 GameEvents 委托（排查泄漏用，日志很多）
    AdvancedGameEventsLeakDetection = false

    // 记录场景销毁后残留的全部 GameEvents 订阅者
    LogGameEventsSubscribers = false
  }

  COMMNET_THROTTLING_SETTINGS
  {
    // CommNet 两次更新的最大游戏时间间隔（再大也不会提帧，只会让断连更迟钝）
    maxGameTimeInterval = 2.5

    // CommNet 两次更新的最小真实毫秒间隔（推荐 20 或 500~1000，中间值会掉帧）
    minRealTimeInterval = 20
  }
}
