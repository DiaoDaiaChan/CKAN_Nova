KSP_COMMUNITY_FIXES
{
  // #### 稳定性修复
  // 关闭 Kraken 的浮点异常，长期飞行时减少零件抖动。
  // Type: bool
  // Default: True
  ApplyKrakenFix = True

  // 出舱 / 对接口的间隙补偿。改动会在存档里留下痕迹。
  PartStartStability = True

  // #### 性能
  // 缓存反射结果，减少每帧分配。
  CacheReflectionAllocations = True

  // PAW 分组折叠：少画一部分 UI。
  PAWGroupCollapse = True

  // 扳手模式下的粒子修复。
  KittenGameModeFix = False

  // #### 时间加速
  // 时间加速中的 SAS 保持。
  TimeWarpSASFix = True
  // 时间加速结束后的姿态回插值步长（秒）。
  // Type: float
  // Min: 0.0
  // Max: 1.0
  // Default: 0.5
  TimeWarpAttitudeInterpolationStep = 0.5

  // 最大同时存在的补丁节点数。
  // Type: int
  // Min: 1
  // Max: 64
  // Default: 8
  MaxPatchedConicsCount = 8

  // #### 兼容性
  // 允许与 Lmp 一起运行。
  LmpCompatibilityFix = True
  // 反射加载异常兜底。
  ReflectionTypeLoadExceptionFix = True
  // 本地化字符串缓存模式。
  // Type: enum
  // Values: None, OnDemand, Pregenerate
  // Default: OnDemand
  CacheLocalizerStrings = OnDemand

  // #### 调试
  // 写出额外日志（会明显拖慢启动）。
  VerboseLogging = False
  // 日志文件保留份数。
  MaxLogFiles = 3
}
